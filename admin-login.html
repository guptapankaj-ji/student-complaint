<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
            color: white;
        }
        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-container p {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 8px;
            font-size: 15px;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #1d4ed8;
        }
        .back-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .error {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
        }
        .admin-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="admin-icon">
            🛡️
        </div>
        <h1>Admin Login</h1>
        <p>Student Complaint Management System</p>
        <div class="error" id="errorMessage">
            Invalid username or password.
        </div>
        <form onsubmit="adminLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    required
                >
            </div>
            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >
            </div>
            <button
                type="submit"
                class="login-btn">
                Login as Admin
            </button>
        </form>
        <button
            class="back-btn"
            onclick="goBack()">
            Back to Student Login
        </button>
    </div>
    <script>
        function adminLogin(event) {
            event.preventDefault();
            const username =
                document.getElementById("username").value.trim();
            const password =
                document.getElementById("password").value.trim();
            const errorMessage =
                document.getElementById("errorMessage");
            /*
                Temporary Admin Login
                Username: admin
                Password: admin123
            */
            if (username === "admin" && password === "admin123") {
                // Store admin login information
                localStorage.setItem(
                    "loggedInAdmin",
                    JSON.stringify({
                        username: username
                    })
                );
                // Open admin dashboard
                window.location.href = "admin.html";
            } else {
                errorMessage.style.display = "block";
            }
        }
        function goBack() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
